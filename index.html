<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AssetHub - College Asset Booking & Management ERP</title>
    <meta name="description" content="Smart Department Asset Booking and Management System using MERN Stack, temporary and permanent bookings, conflict prevention, consumable stock issues, and audit logs." />
    <meta property="og:title" content="AssetHub - College Asset Booking & Management ERP" />
    <meta property="og:description" content="Smart Department Asset Booking and Management System using MERN Stack, temporary and permanent bookings, conflict prevention, consumable stock issues, and audit logs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#009299" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="bg-[#f8f9ff] text-[#0b1c30] antialiased">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0e1c2f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 56px; height: 56px; border-radius: 14px; background: #009299; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 4px 14px rgba(0, 146, 153, 0.4);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            <line x1="6" y1="6" x2="6.01" y2="6"></line>
            <line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
        </div>
        <h1 style="font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 6px 0; color: #ffffff;">AssetHub ERP</h1>
        <p style="font-size: 13px; color: #77849c; margin: 0 0 24px 0; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600;">College Asset Booking &amp; Inventory Node</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(203, 219, 245, 0.2); border-top-color: #009299; border-radius: 50%; animation: assetHubSpin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <p style="font-size: 12px; color: #cbdbf5; margin: 0; font-family: monospace;">Loading Institutional Cloud...</p>
        <style>
          @keyframes assetHubSpin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
